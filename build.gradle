plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

def xeroCore = file('../xero/core/src/main')

sourceSets {
    main {
        java {
            srcDir new File(xeroCore, 'java')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
    it.options.compilerArgs << '-Xlint:deprecation'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    from(new File(xeroCore, 'resources/xero/data')) {
        include 'minecraft.json', 'jmcc.json', 'extra.json'
        into 'xero/data'
    }
}

tasks.register('printCp') {
    doLast { println sourceSets.main.compileClasspath.asPath }
}

tasks.register('webSite', Exec) {
    group = 'publishing'
    description = 'Собирает сайт из исходников мода и выкладывает его'
    workingDir file('web')
    def windows = System.getProperty('os.name').toLowerCase().contains('win')
    def args = ['deployWeb', '-q']
    if (gradle.startParameter.offline) args << '--offline'
    commandLine(windows ? ['cmd', '/c', file('web/gradlew.bat').absolutePath] + args : [file('web/gradlew').absolutePath] + args)
    ignoreExitValue = true
    doLast {
        if (executionResult.get().exitValue != 0) logger.warn('сайт не выложен — см. вывод выше')
    }
}

if (!providers.gradleProperty('noWeb').isPresent()) {
    tasks.named('build') { finalizedBy 'webSite' }
}
